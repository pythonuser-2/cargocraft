<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoCraft - Safety Simulation Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <style>
        html { background-color: #05060b; height: 100%; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; }
        body { background: transparent; color: #c8cee0; display: flex; flex-direction: column; min-height: 100vh; opacity: 0; overflow-x: hidden; }
        #bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; display: block; }
        header { background-color: rgba(5, 6, 11, 0.9); backdrop-filter: blur(10px); color: #ffffff; padding: 1.25rem 2.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(44, 61, 107, 0.5); z-index: 10; }
        header h1 a { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.15em; color: #ffffff; text-decoration: none; }
        header h1 a:hover { color: #5cf2ff; }
        nav a { color: #8892b0; text-decoration: none; margin-left: 1.5rem; font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px dashed transparent; transition: color 0.2s; }
        nav a:hover, nav a.active { color: #5cf2ff; border-bottom-color: #5cf2ff; }
        main { flex: 1; max-width: 1100px; width: 100%; margin: 2rem auto; padding: 0 1.5rem; z-index: 1; }
        .gt-card { background-color: rgba(16, 18, 27, 0.92); backdrop-filter: blur(12px); border: 1px solid #2c3d6b; border-radius: 12px; padding: 2rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); transform: translateY(15px); opacity: 0; color: #e0e0e0; }
        .gt-card h2 { font-size: 1.1rem; margin-bottom: 1.25rem; text-transform: uppercase; border-bottom: 1px dashed #2c3d6b; padding-bottom: 0.5rem; color: #ffffff; display: flex; justify-content: space-between; align-items: center; }
        .status-banner { padding: 1.2rem; border-radius: 6px; font-weight: bold; text-align: center; margin-bottom: 1.5rem; background-color: rgba(12, 14, 20, 0.95); color: #ffffff; border: 1px solid #2c3d6b; text-transform: uppercase; font-size: 0.85rem; }
        .status-banner.safe { background-color: rgba(0, 255, 102, 0.15); color: #00ff66; border-color: #00ff66; }
        .status-banner.danger { background-color: rgba(255, 51, 68, 0.2); color: #ff3344; border-color: #ff3344; animation: pulse-danger 1s infinite alternate; }
        @keyframes pulse-danger { 0% { transform: scale(1); } 100% { transform: scale(1.01); box-shadow: 0 0 15px rgba(255,51,68,0.4); } }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.8rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px dashed #2c3d6b; color: #c8cee0; background-color: rgba(12, 14, 20, 0.6); }
        th { background-color: rgba(26, 35, 58, 0.85); color: #5cf2ff; border: 1px solid #2c3d6b; text-transform: uppercase; font-size: 0.7rem; }
        .log-row { opacity: 0; transform: translateX(-10px); }
        .action-btns { display: flex; gap: 0.75rem; align-items: center; }
        .gt-btn-clear { display: inline-block; padding: 8px 16px; background-color: rgba(255, 51, 68, 0.2); color: #ff3344; border: 1px solid #ff3344; border-radius: 6px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
        .gt-btn-clear:hover { background-color: #ff3344; color: #05060b; }
        .del-row-btn { background: none; border: none; color: #ff3344; cursor: pointer; font-size: 0.9rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .del-row-btn:hover { background: rgba(255,51,68,0.2); }
        .gt-btn-visual { display: inline-block; padding: 8px 16px; background-color: #5cf2ff; color: #05060b; border: 1px solid #5cf2ff; border-radius: 6px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; text-decoration: none; cursor: pointer; }
        .gt-btn-visual:hover { background-color: #fff; }
        footer { background-color: rgba(5, 6, 11, 0.9); color: #555; text-align: center; padding: 1rem; font-size: 0.75rem; border-top: 1px solid rgba(44, 61, 107, 0.5); z-index: 10; }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <header>
        <h1><a href="index.html">CargoCraft</a></h1>
        <nav>
            <a href="index.html">Intro</a>
            <a href="input.html">Input Module</a>
            <a href="reports.html" class="active">Safety Engine</a>
            <a href="stacking.html">Stacking Visualizer</a>
        </nav>
    </header>
    <main>
        <div class="gt-card">
            <h2>
                <span>Real-Time Structural Simulation & Safety Engine</span>
                <a href="stacking.html" class="gt-btn-visual">Simulate Stacking Order ➔</a>
            </h2>
            
            <div id="statusBanner" class="status-banner">
                Initializing Simulation Engine...
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Container Profile</th>
                        <th>Item Name</th>
                        <th>Dimensions</th>
                        <th>Total Weight</th>
                        <th>Class / Density</th>
                        <th>Center of Gravity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="engineTableBody">
                    <!-- Populated dynamically -->
                </tbody>
            </table>

            <div class="action-btns">
                <button id="clearBtn" class="gt-btn-clear">Clear All Logs</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 CargoCraft Systems</p></footer>

    <script>
    (function() {
      const CFG = { clear: '#05060b', ink: '#c8cee0', bg: '#06070d', line: '#2c3d6b', hot: '#5cf2ff', cells: 1.4, speed: 0.55, grain: 0.016, dprCap: 1.5, maxFragments: 2400000, fps: 60, pointer: true };
      const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const COARSE = matchMedia('(hover: none) and (pointer: coarse)').matches;
      const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
      const MOBILE = innerWidth < 768 || COARSE;
      const cv = document.getElementById('bg');
      const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
      if (!gl) { cv.style.background = CFG.clear; return; }
      const VERT = `#version 300 es\nvoid main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
      const FRAG = `#version 300 es
      precision highp float; out vec4 O; uniform vec2 uRes; uniform float uTime; uniform vec2 uPointer; uniform float uOn; uniform vec3 uBg, uLine, uHot; uniform float uCells, uSpeed, uGrain;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float grid(vec2 g, float w){ vec2 d = abs(fract(g) - 0.5); vec2 f = fwidth(g) * w; vec2 l = smoothstep(f, vec2(0.0), d - f); return max(l.x, l.y); }
      void main(){
        vec2 sp = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y; float horizon = 0.30; float y = sp.y - horizon;
        if (y > -0.006) { float glow = exp(-(y * y) / 0.0016) * 0.55; vec3 sky = uBg + uHot * glow; sky += (h21(gl_FragCoord.xy + fract(uTime) * 33.7) - 0.5) * uGrain; O = vec4(max(sky, 0.0), 1.0); return; }
        float z = 0.36 / -y; vec2 g = vec2(sp.x * z, z + uTime * uSpeed) * uCells; float line = grid(g, 0.9);
        vec2 pw = vec2((uPointer.x - 0.5) * uRes.x / uRes.y, 0.0); float pz = 0.36 / max(0.02, (0.5 - uPointer.y) + horizon);
        float d = length(vec2(sp.x * z, z) - vec2(pw.x * pz / max(pz, 0.001), pz)); float ring = exp(-pow(d - 1.4, 2.0) * 1.6) * uOn;
        float fade = exp(-z * 0.10); vec3 col = uBg; col += uLine * line * fade; col += uHot * line * ring * 1.8 * fade; col += uHot * exp(-(y * y) / 0.0022) * 0.20;
        col += (h21(gl_FragCoord.xy + fract(uTime) * 33.7) - 0.5) * uGrain; O = vec4(max(col, 0.0), 1.0);
      }`;
      function compile(type, src) { const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); return sh; }
      const prog = gl.createProgram(); gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(prog); gl.useProgram(prog);
      const U = {}; for (let i = 0, n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i < n; i++) { const nm = gl.getActiveUniform(prog, i).name.replace(/\[0\]$/, ''); U[nm] = gl.getUniformLocation(prog, nm); }
      const rgb = h => { const n = parseInt(h.slice(1), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
      let W = 0, H = 0; function fit() { const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight; const byTier = Math.min(devicePixelRatio || 1, MOBILE ? 1.25 : (CFG.dprCap || 1.75)); const byArea = Math.sqrt((CFG.maxFragments || 2.4e6) / Math.max(1, w * h)); const dpr = Math.max(0.6, Math.min(byTier, byArea)); const nw = Math.round(w * dpr), nh = Math.round(h * dpr); if (nw === W && nh === H) return false; W = nw; H = nh; cv.width = W; cv.height = H; gl.viewport(0, 0, W, H); return true; }
      fit(); addEventListener('resize', fit, { passive: true });
      const P = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, on: 0 }; if (FINE && !MOBILE) { addEventListener('pointermove', e => { P.tx = e.clientX / innerWidth; P.ty = 1 - e.clientY / innerHeight; P.on = 1; }, { passive: true }); }
      gl.uniform3fv(U.uBg, rgb(CFG.bg)); gl.uniform3fv(U.uLine, rgb(CFG.line)); gl.uniform3fv(U.uHot, rgb(CFG.hot)); gl.uniform1f(U.uCells, CFG.cells); gl.uniform1f(U.uSpeed, CFG.speed); gl.uniform1f(U.uGrain, CFG.grain);
      function draw(t) { if (fit()) gl.viewport(0, 0, W, H); gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uTime, RM ? 3.0 : t); gl.uniform2f(U.uPointer, P.x, P.y); gl.uniform1f(U.uOn, P.on); gl.drawArrays(gl.TRIANGLES, 0, 3); }
      const t0 = performance.now(); let last = t0;
      function loop(now) { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000) || 0.016; last = now; const k = 1 - Math.pow(1 - 0.08, dt * 60); P.x += (P.tx - P.x) * k; P.y += (P.ty - P.y) * k; draw((now - t0) / 1000); }
      draw(0); requestAnimationFrame(loop);
    })();
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            anime.timeline({ easing: 'easeOutExpo' })
                .add({ targets: 'body', opacity: 1, duration: 400 })
                .add({ targets: '.gt-card', translateY: [15, 0], opacity: [0, 1], duration: 600 });

            loadSimulationEngine();

            document.getElementById('clearBtn').addEventListener('click', () => {
                sessionStorage.removeItem('cargoLogs');
                loadSimulationEngine();
            });
        });

        function deleteItem(index) {
            let logs = JSON.parse(sessionStorage.getItem('cargoLogs')) || [];
            logs.splice(index, 1);
            sessionStorage.setItem('cargoLogs', JSON.stringify(logs));
            loadSimulationEngine();
        }

        function loadSimulationEngine() {
            const tbody = document.getElementById('engineTableBody');
            const banner = document.getElementById('statusBanner');
            let logs = JSON.parse(sessionStorage.getItem('cargoLogs')) || [];

            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #8892b0; padding: 2rem;">No active cargo logs found. Please use the Input Module to register items.</td></tr>`;
                banner.className = 'status-banner safe';
                banner.innerHTML = `✅ SYSTEM STATUS: No Cargo Loaded. Ready for Input Stream.`;
                return;
            }

            tbody.innerHTML = '';
            let totalWeight = 0;
            let maxLimit = logs[0].maxWeight || 15000;

            logs.forEach((item, index) => {
                totalWeight += item.weight;
                if(item.maxWeight) maxLimit = item.maxWeight;

                const row = document.createElement('tr');
                row.className = 'log-row';
                row.innerHTML = `
                    <td><strong>${item.containerName}</strong></td>
                    <td>${item.itemName}</td>
                    <td>${item.dimensions}</td>
                    <td>${item.weight.toLocaleString()} kg</td>
                    <td><span style="color: #5cf2ff; font-weight: bold;">▸ ${item.stackRule}</span></td>
                    <td>Balanced (Stable)</td>
                    <td><button class="del-row-btn" onclick="deleteItem(${index})" title="Remove Item">✕</button></td>
                `;
                tbody.appendChild(row);
            });

            anime({
                targets: '.log-row',
                translateX: [-10, 0],
                opacity: [0, 1],
                delay: anime.stagger(80),
                duration: 500,
                easing: 'easeOutExpo'
            });

            const ratio = (totalWeight / maxLimit) * 100;

            if (totalWeight > maxLimit) {
                banner.className = 'status-banner danger';
                banner.innerHTML = `🚨 CRITICAL WARNING: Total Cargo Weight (${totalWeight.toLocaleString()} kg) Exceeds Max Limit (${maxLimit.toLocaleString()} kg)! High Risk of Structural Failure.`;
            } else if (ratio > 85) {
                banner.className = 'status-banner';
                banner.style.backgroundColor = 'rgba(217, 119, 6, 0.2)';
                banner.style.color = '#ffb700';
                banner.style.borderColor = '#ffb700';
                banner.innerHTML = `⚠️ WARNING: Capacity at ${ratio.toFixed(1)}%. Approaching maximum load safety threshold.`;
            } else {
                banner.className = 'status-banner safe';
                banner.innerHTML = `✅ SYSTEM STATUS: All Stacking Margins Stable (${ratio.toFixed(1)}% Capacity Used). Safe for Transit.`;
            }
        }
    </script>
</body>
</html>
